# The apps of the update chain check (README.md), one per line:
#
#   app (repository under ~/helper)  feed name  target  old style  new style
#
# target: the manifest's target (update-<target>.json; Pik is universal).
# old style: how the app's release scripts build a beta with its vendored
# MyGo, which decides the feed linked into the published old version:
#   url-beta     updates.url is …/updates/<app>/beta for a prerelease
#                (scripts/release*.sh, .github/workflows/release.yml)
#   prereleases  updates.url is …/updates/<app> with updates.prereleases
#                (Auralink, VoxtMini: MyGo patch 0006)
#   convention   updates.url is …/updates/<app>; prereleases in beta/ by
#                AudioSmith's MyGo patch 0008, without a setting
# new style: how the app builds with the fork (url-beta, or prereleases
# once it moves to updates.prereleases); upchain.sh --new-style overrides.
Pik         pik         darwin-universal  url-beta     url-beta
Dicta       dicta       darwin-arm64      url-beta     url-beta
Inboxly     inboxly     darwin-arm64      url-beta     url-beta
AudioSmith  audiosmith  darwin-arm64      convention   prereleases
Auralink    auralink    darwin-arm64      prereleases  prereleases
VoxtMini    voxtmini    darwin-arm64      prereleases  prereleases
Paralign    paralign    darwin-arm64      url-beta     url-beta
CaptionCraft captioncraft darwin-arm64    url-beta     url-beta
HereNow     herenow     darwin-arm64      url-beta     url-beta
Act         refto       darwin-arm64      url-beta     url-beta
